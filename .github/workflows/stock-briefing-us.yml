name: "stock-briefing-us (미국 오후 브리핑: 어젯밤 마감 기준 테마·후보·등락 상위 → 텔레그램)"

# 목표 시각은 한국 17:00(미국 정규장 개장 전). 스케줄 지연에 대비해 16:10 에 예약한다. 주문 없음.
# 기본 목록(US_THEMES)과 확장 목록(US_DISCOVERY)을 합쳐 분석한다. 모의투자 규칙은 기본 목록 그대로이고 이 브리핑과 무관하다.
# 스케줄은 저장소 변수 STOCK_ENABLED=true 일 때만 동작(수동 실행은 항상 가능).
on:
  schedule:
    - cron: "10 7 * * 1-5"   # UTC 07:10 = 한국 16:10 (월~금)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-stock.txt
      - run: pip install -r requirements-stock.txt

      - name: Brief
        env:
          ENABLED: ${{ vars.STOCK_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$ENABLED" != "true" ]; then echo "STOCK_ENABLED!=true, 건너뜀"; exit 0; fi
          if git fetch origin stock-data; then git worktree add ../data FETCH_HEAD; else mkdir ../data; fi
          python -m stock.briefing us ../data --telegram
