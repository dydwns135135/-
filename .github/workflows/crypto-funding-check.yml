name: crypto-funding-check (Bitget 실제 펀딩비 확인)

# 조회 전용(API 키·주문 없음). 금·나스닥 등 선물을 롱으로 들고 있을 때 실제 연간 비용이 얼마인지 확인한다.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-trader.txt
      - run: pip install -r requirements-trader.txt
      - name: Funding
        run: python -m crypto.funding_check
      - uses: actions/upload-artifact@v4
        with:
          name: funding-check
          path: data/
