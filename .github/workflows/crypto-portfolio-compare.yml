name: crypto-portfolio-compare (코인 분산 검증)

# 공개 시세만 사용(API 키·주문 없음). BTC·ETH·SOL·XRP 에 같은 앙상블을 적용해 BTC 단독과 비교한다.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "과거 몇 년치"
        default: "7"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-trader.txt
      - run: pip install -r requirements-trader.txt
      - name: Portfolio
        run: python -m crypto.portfolio_compare --years "${{ github.event.inputs.years || '7' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-compare
          path: data/
