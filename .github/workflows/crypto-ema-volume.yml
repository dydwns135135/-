name: crypto-ema-volume (EMA 20/50 + 거래량 돌파 지표 백테스트)

# 공개 시세만 사용(API 키·주문 없음). TradingView 지표 규칙 그대로 백테스트한다.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "과거 몇 년치"
        default: "3"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-trader.txt
      - run: pip install -r requirements-trader.txt
      - name: Backtest
        run: python -m crypto.ema_volume --years "${{ github.event.inputs.years || '3' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ema-volume
          path: data/
