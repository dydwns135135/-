name: "stock-dart-check (종목 공시 확인: 종목코드 입력 → 텔레그램)"

# 지정한 종목의 최근 공시 제목을 날짜와 함께 확인한다. 수동 실행 전용, DART_API_KEY 시크릿 필요. 주문은 하지 않는다.
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "종목코드(공백으로 구분). 기본: 한국가스공사 036460, 하이트진로 000080"
        type: string
        default: "036460 000080"
      days:
        description: "며칠 전까지"
        type: string
        default: "90"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-stock.txt
      - run: pip install -r requirements-stock.txt
      - name: Check disclosures
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CODES: ${{ inputs.codes }}
          DAYS: ${{ inputs.days }}
        run: |
          python - <<'PY'
          import os
          from stock.dart import check_report
          from trader import notify
          out = check_report(os.environ["CODES"].split(), int(os.environ["DAYS"] or 90))
          print(out)
          notify.send("📑 공시 확인\n" + out[:3500])
          PY
