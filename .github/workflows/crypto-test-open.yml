name: crypto-test-open (데모 테스트 주문)

# 데모 계좌 전용 테스트. 선택할 값이 없고, 실거래 키/모드는 사용하지 않는다.
on:
  workflow_dispatch:

concurrency: crypto-futures

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-trader.txt
      - run: pip install -r requirements-trader.txt
      - name: Run
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m crypto --symbol "BTC/USDT:USDT" --leverage 2 --test-open
