name: "stock-backtest (분석기 성과 확인 → 텔레그램)"

# 과거 3년치 일봉으로 각 날짜의 신호를 다시 계산해, 신호가 뜬 뒤 5·10거래일 수익률을 기준선과 비교한다. 주문은 하지 않는다.
# 스케줄은 저장소 변수 STOCK_ENABLED=true 일 때만 동작(수동 실행은 항상 가능). 텔레그램은 기존 시크릿을 쓴다.
on:
  schedule:
    - cron: "0 1 * * 6"   # UTC 토 01:00 = 한국 토요일 10:00 (주 1회)
  workflow_dispatch:
    inputs:
      demo:
        description: "합성 데이터로 시험(실데이터 대신)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-stock.txt
      - run: pip install -r requirements-stock.txt

      - name: Backtest (KR, US)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLED: ${{ vars.STOCK_ENABLED }}
          DEMO: ${{ inputs.demo }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$ENABLED" != "true" ]; then echo "STOCK_ENABLED!=true, 건너뜀"; exit 0; fi
          KR="--naver"; US="--yahoo"; if [ "$DEMO" = "true" ]; then KR="--demo"; US="--demo --us"; fi
          python -m stock $KR --backtest --telegram
          python -m stock $US --backtest --telegram
