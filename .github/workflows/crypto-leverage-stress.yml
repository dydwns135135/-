name: crypto-leverage-stress (레버리지·손절 스트레스 테스트)

# 공개 시세만 사용(API 키·주문 없음). BTC 앙상블을 레버리지 1~10배 × 손절 폭 조합으로 과거 데이터에 적용해 청산·손절 횟수와 최종 잔고를 본다.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "과거 몇 년치"
        default: "7"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-trader.txt
      - run: pip install -r requirements-trader.txt
      - name: Stress
        run: python -m crypto.leverage_stress --years "${{ github.event.inputs.years || '7' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: leverage-stress
          path: data/
