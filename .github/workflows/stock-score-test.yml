name: "stock-score-test (분석기 점수 재확인: 학습/확인 구간 + 다음 날 시가 → 텔레그램)"

# 분석기의 가격 기반 점수·구성 항목·단계가 앞 구간(학습)에서 고른 기준 그대로 마지막 1년(확인)에서도 전체 평균보다 나았는지 시험한다.
# 한국은 시가총액 상위(코스피 100 + 코스닥 50)와 기존 목록, 미국은 기존 목록을 쓴다. 수동 실행 전용, 주문 없음.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "walk=해마다 확인(5~10년치, 오래 걸림) / robust=최근 1년 확인 / both"
        type: choice
        options: [walk, robust, both]
        default: walk
      demo:
        description: "합성 데이터로 시험(실데이터 대신)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-stock.txt
      - run: pip install -r requirements-stock.txt

      - name: Score test (KR, US)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEMO: ${{ inputs.demo }}
          KIND: ${{ inputs.kind }}
        run: |
          KR="--naver"; US="--yahoo"; if [ "$DEMO" = "true" ]; then KR="--demo"; US="--demo --us"; fi
          if [ "$KIND" != "robust" ]; then
            python -m stock $KR --score-walk --telegram
            python -m stock $US --score-walk --telegram
          fi
          if [ "$KIND" != "walk" ]; then
            python -m stock $KR --score-robust --telegram
            python -m stock $US --score-robust --telegram
          fi
