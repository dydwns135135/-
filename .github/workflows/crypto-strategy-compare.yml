name: crypto-strategy-compare (대표 매매 규칙 비교)

# 공개 시세만 사용(API 키·주문 없음). 결과는 로그와 실행 요약 화면에 표로 나온다.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "과거 몇 년치"
        default: "7"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-trader.txt
      - run: pip install -r requirements-trader.txt
      - name: Compare
        run: python -m crypto.strategy_compare --years "${{ github.event.inputs.years || '7' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: btc-1d-strategy-compare
          path: data/
