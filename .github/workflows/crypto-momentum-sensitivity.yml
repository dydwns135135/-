name: crypto-momentum-sensitivity (모멘텀 이웃 값 검증)

# 공개 시세만 사용(API 키·주문 없음). 90일 모멘텀이 우연인지 30~250일 이웃 값으로 확인한다.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "과거 몇 년치"
        default: "7"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-trader.txt
      - run: pip install -r requirements-trader.txt
      - name: Sensitivity
        run: python -m crypto.momentum_sensitivity --years "${{ github.event.inputs.years || '7' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: momentum-sensitivity
          path: data/
