name: crypto-rsi-ema (RSI반전+EMA200필터 전략 백테스트)

# 공개 시세만 사용(API 키·주문 없음). TradingView 전략 규칙 그대로 Bitget 1시간·4시간봉으로 백테스트한다.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "과거 몇 년치"
        default: "3"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-trader.txt
      - run: pip install -r requirements-trader.txt
      - name: Backtest
        run: python -m crypto.rsi_ema --years "${{ github.event.inputs.years || '3' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rsi-ema
          path: data/
