name: crypto-mix-leverage (섞기 롱만·롱숏 × 1·3·5·10배 청산 시뮬레이션)

# 공개 시세만 사용(API 키·주문 없음). 실거래 봇 설정을 바꾸기 전에 롱·숏과 레버리지의 위험을 숫자로 확인한다.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "과거 몇 년치(일봉)"
        default: "7"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-trader.txt
      - run: pip install -r requirements-trader.txt
      - name: Simulate
        run: python -m crypto.mix_leverage --years "${{ github.event.inputs.years || '7' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mix-leverage
          path: data/
