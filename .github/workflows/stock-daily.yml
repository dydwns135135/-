name: "stock-daily (한국 주식 종목 분석 → 텔레그램)"

# 평일 장 마감 후 시황·수급 테마·선점 후보를 분석해 텔레그램으로 보낸다. 주문은 하지 않는다.
# 스케줄은 저장소 변수 STOCK_ENABLED=true 일 때만 동작(수동 실행은 항상 가능).
# 텔레그램: 기존 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 시크릿 사용. 공시 확인은 선택: DART_API_KEY 시크릿.
on:
  schedule:
    - cron: "30 7 * * 1-5"   # UTC 07:30 = 한국 16:30 (월~금, 장 마감·수급 확정 후)
  workflow_dispatch:
    inputs:
      demo:
        description: "합성 데이터로 시험(실데이터 대신)"
        type: boolean
        default: false

permissions:
  contents: write   # 수급 스냅샷을 stock-data 브랜치에 저장하기 위해 필요(코드 브랜치는 건드리지 않음)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-stock.txt
      - run: pip install -r requirements-stock.txt

      - name: Analyze
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ENABLED: ${{ vars.STOCK_ENABLED }}
          DEMO: ${{ inputs.demo }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$ENABLED" != "true" ]; then echo "STOCK_ENABLED!=true, 건너뜀"; exit 0; fi
          SRC="--naver"; if [ "$DEMO" = "true" ]; then SRC="--demo"; fi
          DART=""; if [ -n "$DART_API_KEY" ]; then DART="--dart"; fi
          python -m stock $SRC $DART --telegram --out result

      # 한국 수급은 과거 이력을 구할 수 없어 매일의 분석 결과를 stock-data 브랜치에 날짜별 CSV로 쌓는다(나중에 수급 버전 시험에 사용).
      - name: Save snapshot
        if: ${{ !inputs.demo && hashFiles('result/snapshot.csv') != '' }}
        continue-on-error: true   # 저장 실패가 텔레그램 리포트를 막지 않게
        run: |
          D=$(python -c "import pandas as pd; print(pd.read_csv('result/snapshot.csv')['date'].max())")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin stock-data; then
            git worktree add -B stock-data ../data FETCH_HEAD
          else
            git worktree add --orphan -b stock-data ../data
          fi
          mkdir -p ../data/kr
          cp result/snapshot.csv "../data/kr/$D.csv"
          cd ../data
          git add kr
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "한국 수급 스냅샷 $D"
          git push origin stock-data || { git pull --rebase origin stock-data && git push origin stock-data; }

      - uses: actions/upload-artifact@v4
        with:
          name: stock-result
          path: result/
