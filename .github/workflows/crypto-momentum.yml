name: crypto-momentum (일봉 모멘텀 롱만, 데모 전용)

# 데모 계좌 전용: 실거래 옵션이 없다. 매일 UTC 00:15(한국 09:15) 일봉 마감 직후 한 번 판단한다.
# 스케줄은 저장소 변수 MOMENTUM_ENABLED=true 일 때만 동작한다(수동 실행은 항상 가능).
on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency: crypto-futures

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-trader.txt
      - run: pip install -r requirements-trader.txt
      - name: Run
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLED: ${{ vars.MOMENTUM_ENABLED }}
          LOOKBACK: ${{ vars.MOMENTUM_LOOKBACK || '90' }}
          ALLOC: ${{ vars.MOMENTUM_ALLOC || '0.5' }}
          MODE: ${{ vars.MOMENTUM_MODE || 'single' }}
          MAX_NOTIONAL: ${{ vars.MOMENTUM_MAX_NOTIONAL }}   # 선택: 포지션 금액 상한(USDT)
          MIN_EQUITY: ${{ vars.MOMENTUM_MIN_EQUITY }}       # 선택: 최소 잔고(USDT), 아래면 전량 청산·중단
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$ENABLED" != "true" ]; then echo "MOMENTUM_ENABLED!=true, 건너뜀"; exit 0; fi
          EXTRA=""
          if [ -n "$MAX_NOTIONAL" ]; then EXTRA="$EXTRA --max-notional $MAX_NOTIONAL"; fi
          if [ -n "$MIN_EQUITY" ]; then EXTRA="$EXTRA --min-equity $MIN_EQUITY"; fi
          python -m crypto.momentum_bot --mode "$MODE" --lookback "$LOOKBACK" --alloc "$ALLOC" $EXTRA
