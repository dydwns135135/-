name: "stock-macd-test (TS Pro MACD 신호 시험 → 텔레그램)"

# TradingView 지표 'Trend Standard Pro (Stock)' 의 일봉 신호가 과거 3년 데이터에서 전체 종목 평균보다 나았는지 한국·미국에서 시험한다.
# 한국은 시가총액 상위(코스피 100 + 코스닥 50)와 기존 목록, 미국은 기존 목록을 쓴다. 수동 실행 전용, 주문 없음.
on:
  workflow_dispatch:
    inputs:
      demo:
        description: "합성 데이터로 시험(실데이터 대신)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-stock.txt
      - run: pip install -r requirements-stock.txt

      - name: MACD test (KR, US)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEMO: ${{ inputs.demo }}
        run: |
          KR="--naver"; US="--yahoo"; if [ "$DEMO" = "true" ]; then KR="--demo"; US="--demo --us"; fi
          python -m stock $KR --macd --telegram
          python -m stock $US --macd --telegram
