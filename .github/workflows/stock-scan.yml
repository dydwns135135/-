name: "stock-scan (한국 시장 훑기 → 텔레그램, 결과 저장)"

# 네이버 모바일 JSON 의 테마 목록에서 오늘 오르는 테마를 자동으로 골라 구성 종목을 분석하고 텔레그램으로 보낸다. 주문은 하지 않는다.
# 한국시간 19:40에 평일마다 돌며, 결과(종목별 점수·소속 테마)를 stock-data 브랜치의 scan/<날짜>.csv 로 쌓는다.
# 쌓인 훑기 결과는 매주 토요일 stock-backtest 의 '쌓은 데이터 시험'에서 훑기 상위 종목·테마가 실제로 더 올랐는지 확인하는 데 쓰인다.
# 스케줄은 저장소 변수 STOCK_ENABLED=true 일 때만 동작(수동 실행은 항상 가능).
on:
  schedule:
    - cron: "40 10 * * 1-5"   # UTC 10:40 = 한국 19:40 (월~금)
  workflow_dispatch:

permissions:
  contents: write   # stock-data 브랜치에만 커밋한다(코드 브랜치는 건드리지 않음)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-stock.txt
      - run: pip install -r requirements-stock.txt

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLED: ${{ vars.STOCK_ENABLED }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$ENABLED" != "true" ]; then echo "STOCK_ENABLED!=true, 건너뜀"; exit 0; fi
          python -m stock --scan --telegram --out result

      # 수급이 직전 거래일까지 들어왔는지(flow_last) 확인한다. 네이버는 당일 수급을 저녁 8시 이후에도 주지 않아 하루 늦은 것은 정상으로 본다.
      - name: Check flow freshness
        if: ${{ hashFiles('result/scan_snapshot.csv') != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m stock.flowcheck result/scan_snapshot.csv 훑기 스냅샷

      - name: Save scan snapshot
        if: ${{ hashFiles('result/scan_snapshot.csv') != '' }}
        run: |
          D=$(python -c "import pandas as pd; print(pd.read_csv('result/scan_snapshot.csv')['date'].max())")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin stock-data; then
            git worktree add -B stock-data ../data FETCH_HEAD
          else
            git worktree add --orphan -b stock-data ../data
          fi
          mkdir -p ../data/scan/themes
          cp result/scan_snapshot.csv "../data/scan/$D.csv"
          cp result/scan_themes.csv "../data/scan/themes/$D.csv"
          cd ../data
          git add scan
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "한국 훑기 스냅샷 $D"
          git push origin stock-data || { git pull --rebase origin stock-data && git push origin stock-data; }

      - uses: actions/upload-artifact@v4
        with:
          name: stock-scan-result
          path: result/
