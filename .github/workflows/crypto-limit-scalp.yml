name: "crypto-limit-scalp (지정가 왕복 단타 모의: 수수료별로 이익이 남는지, 주문 없음)"

# 업비트 KRW-ETH 1분봉 공개 시세만 사용(API 키·주문 없음). 빗썸 영상 속 방식(현재가 근처 지정가 매수·매도 반복)을 수수료별로 시험한다.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-trader.txt
      - run: pip install -r requirements-trader.txt
      - name: Simulate
        run: python -m crypto.limit_scalp
      - uses: actions/upload-artifact@v4
        with:
          name: limit-scalp
          path: data/
